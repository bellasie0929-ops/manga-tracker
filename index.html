<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫畫追更記錄本</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --text-color: #333333;
            --border-color: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 16px;
            font-size: 1.4rem;
            color: #111827;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            background-color: #f9fafb;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .input-row-1, .input-row-2 {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        input[type="text"] {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        #mangaName, #mangaProgress {
            flex: 1;
            min-width: 0;
        }

        .toggle-btn {
            padding: 8px 14px;
            background-color: #e5e7eb;
            color: #374151;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            user-select: none;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .toggle-btn.active-main {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
        }

        .toggle-btn.active-extra {
            background-color: #f59e0b;
            color: white;
            border-color: #d97706;
        }

        button.btn-primary {
            padding: 10px 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        button.btn-primary:hover { background-color: var(--primary-hover); }

        .btn-danger {
            background-color: var(--danger);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            padding: 8px 12px;
            font-size: 13px;
        }

        /* 漫畫列表：分兩行的卡片樣式 */
        .manga-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .manga-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            background-color: #fff;
        }

        .manga-title {
            font-weight: bold;
            font-size: 16px;
            color: #1f2937;
            word-break: break-word;
        }

        .manga-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
        }

        .manga-controls input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 8px 10px;
            font-size: 15px;
        }

        .tools {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        .tools button {
            flex: 1;
            font-size: 13px;
            padding: 10px 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 漫畫追更記錄本</h1>
    
    <!-- 新增漫畫欄位 -->
    <div class="input-group">
        <div class="input-row-1">
            <input type="text" id="mangaName" placeholder="漫畫名稱（例如：魔咒）">
        </div>
        <div class="input-row-2">
            <button type="button" id="typeToggle" class="toggle-btn active-main" onclick="toggleTypeInput()">正傳</button>
            <input type="text" id="mangaProgress" placeholder="話數（例：60）">
            <button class="btn-primary" onclick="addManga()">新增/更新</button>
        </div>
    </div>

    <!-- 漫畫列表清單（手機優化雙行版） -->
    <div id="mangaList" class="manga-list"></div>

    <!-- 資料匯入匯出備份 -->
    <div class="tools">
        <button class="btn-primary" onclick="exportData()" style="background-color: #059669;">匯出備份</button>
        <button class="btn-primary" onclick="document.getElementById('importFile').click()" style="background-color: #d97706;">匯入備份</button>
        <input type="file" id="importFile" style="display: none;" onchange="importData(event)">
    </div>
</div>

<script>
    let currentInputType = 'main';

    const initialData = [
        { name: "1995青春報告", type: "main", value: "60" },
        { name: "疏導危機", type: "main", value: "86" },
        { name: "PASSION", type: "main", value: "138" },
        { name: "素描", type: "extra", value: "14" },
        { name: "不要招惹小狗", type: "extra", value: "13" },
        { name: "珍珠少年", type: "extra", value: "發火尾聲 3" },
        { name: "恩寵之夜", type: "main", value: "21" },
        { name: "魔咒", type: "main", value: "102" },
        { name: "獵人想要平靜的生活", type: "main", value: "66" },
        { name: "親屬關係證明", type: "main", value: "25" },
        { name: "Sweet Sugar Candyman", type: "main", value: "15" },
        { name: "弗林的狐狸飲料", type: "main", value: "67" },
        { name: "請公私分明", type: "main", value: "94" },
        { name: "Hit Me Hard", type: "main", value: "35" },
        { name: "UNSLEEP", type: "main", value: "78" },
        { name: "Unnormal", type: "main", value: "12" },
        { name: "STAGE BEHIND", type: "main", value: "41" },
        { name: "Happy Twogether", type: "main", value: "33" },
        { name: "讓我來介紹我的經紀人", type: "main", value: "19" },
        { name: "Shutline", type: "main", value: "113" },
        { name: "融冰曲線", type: "main", value: "33" },
        { name: "Alpha創傷", type: "main", value: "43" },
        { name: "不想看我發瘋的話，就給我生隻小豹貓！", type: "main", value: "33" },
        { name: "應念而至", type: "main", value: "59" }
    ];

    let mangaList = JSON.parse(localStorage.getItem('mangaListData')) || initialData;

    function toggleTypeInput() {
        const btn = document.getElementById('typeToggle');
        if (currentInputType === 'main') {
            currentInputType = 'extra';
            btn.textContent = '外傳';
            btn.className = 'toggle-btn active-extra';
        } else {
            currentInputType = 'main';
            btn.textContent = '正傳';
            btn.className = 'toggle-btn active-main';
        }
    }

    function render() {
        const listContainer = document.getElementById('mangaList');
        listContainer.innerHTML = '';
        mangaList.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'manga-item';
            
            const isMain = item.type !== 'extra';
            const btnClass = isMain ? 'toggle-btn active-main' : 'toggle-btn active-extra';
            const btnText = isMain ? '正傳' : '外傳';

            div.innerHTML = `
                <div class="manga-title">${item.name}</div>
                <div class="manga-controls">
                    <button type="button" class="${btnClass}" onclick="toggleRowType(${index})">${btnText}</button>
                    <input type="text" value="${item.value}" onchange="updateRowValue(${index}, this.value)">
                    <button class="btn-danger" onclick="deleteManga(${index})">刪除</button>
                </div>
            `;
            listContainer.appendChild(div);
        });
        localStorage.setItem('mangaListData', JSON.stringify(mangaList));
    }

    function toggleRowType(index) {
        mangaList[index].type = (mangaList[index].type === 'extra') ? 'main' : 'extra';
        render();
    }

    function updateRowValue(index, newValue) {
        mangaList[index].value = newValue.trim();
        localStorage.setItem('mangaListData', JSON.stringify(mangaList));
    }

    function addManga() {
        const nameInput = document.getElementById('mangaName');
        const progressInput = document.getElementById('mangaProgress');
        const name = nameInput.value.trim();
        const value = progressInput.value.trim();

        if (!name) return alert('請輸入漫畫名稱');
        if (!value) return alert('請輸入話數或內容');

        const existingIndex = mangaList.findIndex(item => item.name.toLowerCase() === name.toLowerCase());
        if (existingIndex !== -1) {
            mangaList[existingIndex].type = currentInputType;
            mangaList[existingIndex].value = value;
        } else {
            mangaList.push({ name, type: currentInputType, value });
        }

        nameInput.value = '';
        progressInput.value = '';
        render();
    }

    function deleteManga(index) {
        if (confirm(`確定要刪除《${mangaList[index].name}》嗎？`)) {
            mangaList.splice(index, 1);
            render();
        }
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(mangaList, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `manga_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importData(event) {
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (Array.isArray(imported)) {
                    mangaList = imported;
                    render();
                    alert('備份匯入成功！');
                }
            } catch (err) {
                alert('檔案格式錯誤，無法匯入');
            }
        };
        reader.readAsText(event.target.files[0]);
    }

    render();
</script>

</body>
</html>
